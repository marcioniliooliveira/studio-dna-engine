  <script>
      (() => {
        "use strict";

        if (typeof gsap !== 'undefined' && gsap.registerPlugin) {
        var _p = [ScrollTrigger].filter(function(p) { return typeof p !== 'undefined'; });
        if (_p.length > 0) gsap.registerPlugin.apply(gsap, _p);
      }

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const body = document.body;

        function splitWords(element) {
          if (element.dataset.wordsReady === "true") return [];

          const walker = document.createTreeWalker(
            element,
            NodeFilter.SHOW_TEXT,
            {
              acceptNode(node) {
                return node.nodeValue.trim()
                  ? NodeFilter.FILTER_ACCEPT
                  : NodeFilter.FILTER_REJECT;
              }
            }
          );

          const nodes = [];
          while (walker.nextNode()) nodes.push(walker.currentNode);

          nodes.forEach(node => {
            const fragment = document.createDocumentFragment();
            const parts = node.nodeValue.split(/(\s+)/);

            parts.forEach(part => {
              if (!part.trim()) {
                fragment.appendChild(document.createTextNode(part));
                return;
              }

              const mask = document.createElement("span");
              const word = document.createElement("span");

              mask.className = "word-mask";
              word.className = "reveal-word";

              mask.style.display = "inline-block";
              mask.style.overflow = "hidden";
              mask.style.verticalAlign = "bottom";
              mask.style.paddingBottom = "0.08em";
              mask.style.marginBottom = "-0.08em";

              word.style.display = "inline-block";
              word.style.willChange = "transform, opacity, filter";
              word.textContent = part;

              mask.appendChild(word);
              fragment.appendChild(mask);
            });

            node.parentNode.replaceChild(fragment, node);
          });

          element.dataset.wordsReady = "true";
          return Array.from(element.querySelectorAll(".reveal-word"));
        }

        const wordRevealElements = Array.from(document.querySelectorAll(".word-reveal"));

        wordRevealElements.forEach((element, index) => {
          const words = splitWords(element);

          if (reducedMotion) {
            gsap.set(words, { clearProps: "all" });
            return;
          }

          gsap.fromTo(
            words,
            {
              yPercent: 125,
              opacity: 0,
              filter: "blur(0.75rem)",
              rotateX: -35,
              transformOrigin: "50% 100%"
            },
            {
              yPercent: 0,
              opacity: 1,
              filter: "blur(0rem)",
              rotateX: 0,
              duration: 1.15,
              stagger: 0.055,
              ease: "power4.out",
              scrollTrigger: {
                trigger: element,
                start: index === 0 ? "top 96%" : "top 82%",
                toggleActions: "play none none reverse"
              }
            }
          );
        });

        if (!reducedMotion) {
          gsap.utils.toArray(".reveal-copy, .reveal-link").forEach((element, index) => {
            gsap.fromTo(
              element,
              {
                y: 38,
                opacity: 0,
                filter: "blur(0.65rem)"
              },
              {
                y: 0,
                opacity: 1,
                filter: "blur(0rem)",
                duration: 1,
                delay: (index % 3) * 0.04,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: element,
                  start: "top 88%",
                  toggleActions: "play none none reverse"
                }
              }
            );
          });
        }

        const words = gsap.utils.toArray(".kinetic-word");

        if (words.length) {
          gsap.set(words, {
            yPercent: 120,
            opacity: 0,
            filter: "blur(0.5rem)"
          });

          const wordTimeline = gsap.timeline({ repeat: -1 });

          words.forEach(word => {
            wordTimeline
              .to(word, {
                yPercent: 0,
                opacity: 1,
                filter: "blur(0rem)",
                duration: 0.7,
                ease: "power4.out"
              })
              .to(word, {
                yPercent: 0,
                opacity: 1,
                duration: 1.1
              })
              .to(word, {
                yPercent: -120,
                opacity: 0,
                filter: "blur(0.5rem)",
                duration: 0.65,
                ease: "power4.in"
              });
          });
        }

        if (!reducedMotion) {
          gsap.to(".hero-parallax", {
            yPercent: 14,
            scale: 1.08,
            ease: "none",
            scrollTrigger: {
              trigger: "#top",
              start: "top top",
              end: "bottom top",
              scrub: 1.4
            }
          });

          gsap.fromTo(
            ".hero-wipe",
            { yPercent: 110 },
            {
              yPercent: -18,
              ease: "none",
              scrollTrigger: {
                trigger: "#top",
                start: "top top",
                end: "bottom top",
                scrub: 1.2
              }
            }
          );

          gsap.to("#heroTitle", {
            yPercent: -24,
            scale: 0.96,
            opacity: 0.2,
            ease: "none",
            scrollTrigger: {
              trigger: "#top",
              start: "45% top",
              end: "bottom top",
              scrub: 1.2
            }
          });

          gsap.utils.toArray(".story-orbit").forEach((shape, index) => {
            gsap.to(shape, {
              xPercent: index ? -24 : -42,
              yPercent: index ? 30 : -20,
              rotate: index ? -35 : 42,
              scale: index ? 1.2 : 0.86,
              ease: "none",
              scrollTrigger: {
                trigger: "#story",
                start: "top bottom",
                end: "bottom top",
                scrub: 1.5
              }
            });
          });

          gsap.utils.toArray(".story-panel").forEach(panel => {
            const media = panel.querySelector(".panel-parallax");
            const curtain = panel.querySelector(".image-curtain");
            const copy = panel.querySelector(".reveal-copy");
            const link = panel.querySelector(".reveal-link");

            gsap.fromTo(
              media,
              { yPercent: -6, scale: 1.06 },
              {
                yPercent: 7,
                scale: 1,
                ease: "none",
                scrollTrigger: {
                  trigger: panel,
                  start: "top bottom",
                  end: "bottom top",
                  scrub: 1.5
                }
              }
            );

            gsap.fromTo(
              curtain,
              { xPercent: 115 },
              {
                xPercent: -15,
                ease: "none",
                scrollTrigger: {
                  trigger: panel,
                  start: "top 70%",
                  end: "bottom 35%",
                  scrub: 1.1
                }
              }
            );

            gsap.fromTo(
              [copy, link],
              { y: 50, opacity: 0, filter: "blur(0.6rem)" },
              {
                y: 0,
                opacity: 1,
                filter: "blur(0rem)",
                stagger: 0.12,
                duration: 1,
                ease: "power3.out",
                scrollTrigger: {
                  trigger: panel,
                  start: "top 52%",
                  toggleActions: "play none none reverse"
                }
              }
            );
          });

          gsap.to(".journal-parallax", {
            yPercent: 18,
            scale: 1.08,
            ease: "none",
            scrollTrigger: {
              trigger: "#journal",
              start: "top bottom",
              end: "bottom top",
              scrub: 1.5
            }
          });

          gsap.utils.toArray(".newsletter-shape").forEach((shape, index) => {
            gsap.to(shape, {
              xPercent: index ? -16 : -35,
              yPercent: index ? 25 : 50,
              rotate: index ? 30 : -45,
              ease: "none",
              scrollTrigger: {
                trigger: shape.closest("section"),
                start: "top bottom",
                end: "bottom top",
                scrub: 1.6
              }
            });
          });
        }

        const productStory = document.getElementById("productStory");
        const productTrack = document.getElementById("productTrack");
        const productSlides = gsap.utils.toArray(".product-slide");
        const productCounter = document.getElementById("productCounter");
        const productProgress = document.getElementById("productProgress");

        if (productStory && productTrack && productSlides.length) {
          const horizontalTween = gsap.to(productTrack, {
            x: () => -(productTrack.scrollWidth - window.innerWidth),
            ease: "none",
            scrollTrigger: {
              trigger: productStory,
              start: "top top",
              end: () => `+=${productTrack.scrollWidth - window.innerWidth}`,
              pin: true,
              scrub: 1.15,
              invalidateOnRefresh: true,
              anticipatePin: 1,
              onUpdate(self) {
                const activeIndex = Math.min(
                  productSlides.length - 1,
                  Math.round(self.progress * (productSlides.length - 1))
                );

                productCounter.textContent =
                  String(activeIndex + 1).padStart(2, "0") +
                  " / " +
                  String(productSlides.length).padStart(2, "0");

                gsap.set(productProgress, { scaleX: self.progress });
              }
            }
          });

          productSlides.forEach(slide => {
            const image = slide.querySelector(".product-image");
            const elements = slide.querySelectorAll(".product-meta, .product-title, .product-copy, .product-action");

            if (!reducedMotion) {
              gsap.fromTo(
                image,
                { xPercent: -6, scale: 1.1 },
                {
                  xPercent: 6,
                  scale: 1,
                  ease: "none",
                  scrollTrigger: {
                    trigger: slide,
                    containerAnimation: horizontalTween,
                    start: "left right",
                    end: "right left",
                    scrub: 1.2
                  }
                }
              );

              gsap.fromTo(
                elements,
                {
                  y: 54,
                  opacity: 0,
                  filter: "blur(0.7rem)"
                },
                {
                  y: 0,
                  opacity: 1,
                  filter: "blur(0rem)",
                  stagger: 0.1,
                  duration: 1,
                  ease: "power3.out",
                  scrollTrigger: {
                    trigger: slide,

          if (spans.length >= 2) {
            spans[0].textContent = String(activeCardIdx + 1).padStart(2, '0');
          }
        });
      }

      renderStackingCard(0);
      let cardTimer = setInterval(function() {
        renderStackingCard(activeCardIdx + 1);
      }, 4500);

      // Conecta botões/setas de navegação
      document.querySelectorAll('.problems_home_stats button, .problems_home_stats a, [class*="stats_nav"], .problems_stats_navigation').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          clearInterval(cardTimer);
          renderStackingCard(activeCardIdx + 1);
          cardTimer = setInterval(function() {
            renderStackingCard(activeCardIdx + 1);
          }, 4500);
        });
      });
    }

    // --- 9. SCROLL-LINKED TEXT HIGHLIGHT REVEAL ([data-highlight-text]) ---
    document.querySelectorAll('[data-highlight-text]').forEach(function(container) {
      if (container.dataset.highlightActivated) return;
      container.dataset.highlightActivated = 'true';
      const text = container.innerText.trim();
      const words = text.split(/\s+/);
      container.innerHTML = '';
      const wordSpans = words.map(function(w) {
        const span = document.createElement('span');
        span.textContent = w + ' ';
        span.style.display = 'inline';
        span.style.transition = 'color 0.35s ease, opacity 0.35s ease';
        span.style.color = '#71717a';
        span.style.opacity = '0.35';
        container.appendChild(span);
        return span;
      });

      function updateTextHighlight() {
        const rect = container.getBoundingClientRect();
        const winH = window.innerHeight;
        const progress = Math.min(Math.max((winH * 0.85 - rect.top) / (rect.height + winH * 0.35), 0), 1);
        const activeCount = Math.floor(progress * wordSpans.length);

        wordSpans.forEach(function(sp, i) {
          if (i <= activeCount) {
            sp.style.color = '#fafaf9';
            sp.style.opacity = '1';
          } else {
            sp.style.color = '#71717a';
            sp.style.opacity = '0.35';
          }
        });
      }

      window.addEventListener('scroll', updateTextHighlight, { passive: true });
      updateTextHighlight();
    });

    // --- 10. GAP SECTION / KINETIC IMAGE CAROUSEL & LETTER SCRUB ---
    const gapSection = document.querySelector('.gap_home_wrap, [class*="gap_wrap"]');
    if (gapSection) {
      const gapImages = Array.from(gapSection.querySelectorAll('.gap_home_image, [class*="gap_image"]'));
      if (gapImages.length > 1) {
        let gapIdx = 0;
        gapImages.forEach(function(img, i) {
          img.style.transition = 'opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1)';
          img.style.opacity = i === 0 ? '1' : '0';
        });
        setInterval(function() {
          gapImages.forEach(function(img) { img.style.opacity = '0'; });
          gapIdx = (gapIdx + 1) % gapImages.length;
          gapImages[gapIdx].style.opacity = '1';
        }, 900);
      }
    }

    // --- 12. MOTOR UNIVERSAL DE REVELAÇÃO WEBFLOW (data-anim="split", data-anim="element", data-anim="stagger", data-anim="slideUp-once") ---
    if (typeof gsap !== 'undefined') {
      // 12.1 Data-anim split
      document.querySelectorAll('[data-anim="split"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        try {
          if (typeof SplitText !== 'undefined') {
            const cleanText = el.getAttribute('aria-label') || el.textContent.trim();
            el.innerHTML = cleanText;
            const st = new SplitText(el, { type: 'lines', linesClass: 'split-line', mask: 'lines' });
            if (st.lines && st.lines.length > 0) {
              const triggerEl = el.closest('section, .wrap') || el;
              gsap.from(st.lines, {
                y: '100%',
                opacity: 0,
                duration: 0.8,
                stagger: 0.08,
                ease: 'power3.out',
                scrollTrigger: {
                  trigger: triggerEl,
                  start: 'top 90%',
                  once: true
                }
              });
            }
          }
        } catch(e) {}
      });

      // 12.2 Data-anim element e slideUp-once
      document.querySelectorAll('[data-anim="element"], [data-anim="slideUp-once"]').forEach(function(el) {
        if (el.closest('.amenities-slide-box')) return;
        const triggerEl = el.closest('section, .wrap') || el;
        gsap.fromTo(el, 
          { y: 30, opacity: 0 },
          {
            y: 0,
            opacity: 1,
            duration: 0.8,
            ease: 'power2.out',
            scrollTrigger: {
              trigger: triggerEl,
              start: 'top 90%',
              once: true
            }
          }
        );
      });

      // 12.3 Data-anim stagger
      document.querySelectorAll('[data-anim="stagger"]').forEach(function(el) {
        const children = Array.from(el.children).filter(function(child) {
          return !child.hasAttribute('data-dropdown-list') && !child.classList.contains('faq-dropdown-list');
        });
        if (children.length > 0) {
          const triggerEl = el.closest('section, .wrap') || el;
          gsap.fromTo(children,
            { y: 40, opacity: 0 },
            {
              y: 0,
              opacity: 1,
              duration: 0.8,
              stagger: 0.1,
              ease: 'power3.out',
              scrollTrigger: {
                trigger: triggerEl,
                start: 'top 90%',
                once: true
              }
            }
          );
        }
      });
      // 12.4 Data-anim img-overlay
      document.querySelectorAll('[data-anim="img-overlay"]').forEach(function(el) {
        gsap.to(el, {
          yPercent: -100,
          duration: 1.1,
          ease: 'power3.inOut',
          scrollTrigger: {
            trigger: el.parentElement || el,
            start: 'top 80%',
            once: true
          }
        });
      });

      // 12.5 Data-anim img-paralax / img-parallax (Parallax de imagens Webflow)
      document.querySelectorAll('[data-anim="img-paralax"], [data-anim="img-parallax"]').forEach(function(el) {
        gsap.fromTo(el,
          { yPercent: -10, scale: 1.1 },
          {
            yPercent: 10,
            scale: 1,
            ease: 'none',
            scrollTrigger: {
              trigger: el.closest('section, .wrap') || el,
              start: 'top bottom',
              end: 'bottom top',
              scrub: true
            }
          }
        );
      });

      // 12.6 FAQ Dropdown Hover & Click Engine
      document.querySelectorAll('.faq [data-dropdown]').forEach(function(dropdown) {
        dropdown.addEventListener('mouseenter', function() {
          dropdown.classList.add('is-active');
        });
        dropdown.addEventListener('mouseleave', function() {
          dropdown.classList.remove('is-active');
        });
        dropdown.addEventListener('click', function() {
          dropdown.classList.toggle('is-active');
        });
      });
    }

    console.log('✅ [Universal Scroll Director] Todos os subsistemas (SplitText, 3D Spinner, Curtains, Sliders, Highlights, Stacking Cards, Accordions, Webflow Reveals) ativados com sucesso.');
  });
})();
</script>
</body></html>
