<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent-activity-7 — Agent Activity | Interactive React Capsule</title>
  <link rel="stylesheet" href="../../theme/app-ui-full-tailwind.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: var(--color-neutral-100, #f5f5f5);
      color: var(--color-neutral-900, #171717);
      font-family: var(--rb-font-sans, var(--font-geist-sans, ui-sans-serif, system-ui, sans-serif));
    }
    html.dark, html.dark body {
      background: #050505;
      color: #f5f5f5;
    }
    #rb-toolbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: color-mix(in oklab, var(--color-neutral-50, #fafafa) 90%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(23, 23, 23, 0.1);
      padding: 8px 16px;
      font-size: 12px;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }
    html.dark #rb-toolbar {
      background: rgba(18, 18, 18, 0.9);
      border-bottom-color: rgba(245, 245, 245, 0.12);
      color: #f5f5f5;
    }
    .rb-tb-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .rb-tb-back, .rb-tb-link {
      color: inherit;
      text-decoration: none;
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(128,128,128,0.25);
      font-weight: 500;
    }
    .rb-tb-back:hover, .rb-tb-link:hover { background: rgba(128,128,128,0.12); }
    .rb-tb-title { margin-right: auto; display: inline-flex; align-items: center; gap: 6px; }
    .rb-tb-cat { opacity: 0.6; }
    .rb-tb-group {
      display: inline-flex;
      padding: 2px;
      border-radius: 7px;
      background: rgba(128,128,128,0.12);
      gap: 2px;
    }
    .rb-tb-btn {
      border: 0;
      background: transparent;
      color: inherit;
      padding: 3px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
    }
    .rb-tb-btn.rb-tb-active {
      background: #ffffff;
      color: #171717;
      box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    }
    html.dark .rb-tb-btn.rb-tb-active {
      background: #2e2e2e;
      color: #ffffff;
    }
    .rb-tb-field {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      opacity: 0.9;
    }
    .rb-tb-field select {
      border: 1px solid rgba(128,128,128,0.28);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      padding: 3px 6px;
      font-size: 12px;
    }
    html.dark .rb-tb-field select option { background: #171717; color: #f5f5f5; }
    .capsule-stage {
      min-height: calc(100vh - 50px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    dna-capsule {
      display: block;
      width: 1280px;
      min-height: 640px;
      background: var(--color-white, #ffffff);
      border-radius: var(--rb-r-xl, 12px);
      overflow: visible;
      box-shadow: 0 10px 30px -12px rgb(0 0 0 / 0.14);
      border: 1px solid rgba(128,128,128,0.16);
    }
    html.dark dna-capsule {
      background: var(--color-neutral-950, #0a0a0a);
    }
    #capsule-root {
      width: 1280px;
      min-height: 640px;
      position: relative;
      border-radius: inherit;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="rb-toolbar"></div>
  <div class="capsule-stage">
    <dna-capsule data-capsule-id="agent-activity-7" data-category="agent-activity" class="rb-theme-scope">
      <div id="capsule-root" class="block-scale-preview rb-theme-scope" aria-description="Run detail with inputs and errors"></div>
    </dna-capsule>
  </div>
  <script src="../../runtime/appui-interactive-runtime.js"></script>
  <script>
    window.ReactBitsAppUI.mountToolbar("agent-activity-7", document.getElementById('capsule-root'), document.getElementById('rb-toolbar'));
  </script>
</body>
</html>
