<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Allowed Test: 3D Front Back Overlap</title>
  <style>
    body { margin: 0; }
    .single-heading-wrap { position: relative; width: 360px; height: 80px; }
    .front, .back { position: absolute; inset: 0; display: block; }
    .back { transform: rotateY(1deg); }
  </style>
</head>
<body>
  <div class="single-heading-wrap">
    <span class="front" data-deep-scrutiny-overlap-group="hero-front-back" data-deep-scrutiny-overlap-role="front">Crescimento real</span>
    <span class="back" data-deep-scrutiny-overlap-group="hero-front-back" data-deep-scrutiny-overlap-role="back">Crescimento real</span>
  </div>
</body>
</html>
