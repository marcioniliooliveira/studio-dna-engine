<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negocia Bem — CTA</title><style>:root{--bg:#0D1117;--accent:#3E9B67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.section{max-width:900px;margin:auto;padding:80px 6vw}.panel{border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:42px;background:linear-gradient(135deg,rgba(62,155,103,.24),rgba(255,255,255,.03))}.section h1{font-size:clamp(2rem,6vw,5rem);line-height:1;margin:0 0 16px}.lead{color:#cad6cf;line-height:1.7}.form{display:grid;gap:12px;margin-top:28px}.form input,.form select,.form textarea{width:100%;border:1px solid rgba(255,255,255,.2);border-radius:10px;background:#111922;color:#fff;padding:14px;font:inherit}.form button{border:0;border-radius:999px;background:var(--accent);color:#fff;padding:15px 22px;font-weight:700;cursor:pointer}.footer{margin-top:52px;color:#aebbb3;font-size:.9rem;line-height:1.8}</style></head><body><section class="section"><div class="panel"><h1>Pronto para conquistar o seu imóvel?</h1><p class="lead">Converse diretamente com nossos corretores credenciados. Tire suas dúvidas ou venha tomar um café conosco na Av. Curitiba.</p><form class="form"><input aria-label="Nome completo" placeholder="Nome completo"><input aria-label="Telefone ou WhatsApp" placeholder="Telefone / WhatsApp"><select aria-label="Tipo de interesse"><option>Tipo de interesse</option><option>Comprar</option><option>Alugar</option><option>Investir</option></select><textarea aria-label="Mensagem" rows="4" placeholder="Mensagem"></textarea><button type="button">FALAR NO WHATSAPP</button></form></div><footer class="footer">Av. Curitiba — Paiçandu/PR · (44) 3801-6654 · CRECI 9314-J<br>© 2026 Negocia Bem Consultoria Imobiliária.</footer></section></body></html>
