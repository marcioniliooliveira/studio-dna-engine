<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negocia Bem — Hero</title><style>:root{--bg:#0D1117;--accent:#3E9B67}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:Arial,sans-serif}.hero{min-height:520px;display:grid;place-items:center;padding:72px 7vw;background:linear-gradient(115deg,#0D1117 15%,#18251f 100%)}.content{max-width:760px}.badge{display:inline-block;color:var(--accent);font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}.title{font-size:clamp(3rem,9vw,7rem);line-height:.9;margin:18px 0}.copy{color:#dbe3df;font-size:1.15rem;line-height:1.7;max-width:650px}.cta{display:inline-block;margin-top:20px;background:var(--accent);color:#fff;border-radius:999px;padding:15px 22px;text-decoration:none;font-weight:700}</style></head><body><section class="hero"><div class="content"><span class="badge">A escolha certa para conquistar o seu sonho</span><h1 class="title">NEGOCIA BEM</h1><p class="copy">Seja para conquistar a casa própria a 15 minutos de Maringá, alugar com agilidade e sem fiador, ou investir com segurança, a Negocia Bem oferece uma assessoria acolhedora e descomplicada.</p><a class="cta" href="#oportunidades">CONHECER OPORTUNIDADES</a></div></section></body></html>
