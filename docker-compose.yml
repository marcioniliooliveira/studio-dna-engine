version: '3.8'

services:
  dnastudio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studio-dna
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./copias:/app/copias
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
    shm_size: '2gb'
